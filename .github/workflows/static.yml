name: Static content

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"

  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Convert View
        shell: bash
        run: |
          set -euo pipefail

          docker build . \
            --target convert-view-builder \
            --tag tmp-convert

          container_id="$(docker create tmp-convert)"

          cleanup() {
            docker rm -f "$container_id" >/dev/null 2>&1 || true
            docker rmi tmp-convert >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          mkdir -p _export
          docker cp "$container_id:/app/publish/." _export/

          echo "Exported site files:"
          ls -la _export

          if [ -z "$(find _export -type f -print -quit)" ]; then
            echo "::error::The Docker build exported no site files."
            exit 1
          fi

      - name: Upload Pages artifact
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _export

  deploy:
    name: Deploy to Pages
    needs: build

    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      pages: write
      id-token: write

    concurrency:
      group: pages-deployment
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
